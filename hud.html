<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Câmera Cinema HUD</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
        font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
      #hud { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center;
        height: 100%; box-sizing: border-box; }
      .pill { background: rgba(20, 20, 28, 0.82); color: #fff; padding: 7px 11px; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18); white-space: nowrap; }
      .pill.on { background: rgba(60, 120, 255, 0.9); }
      .pill.warn { background: rgba(200, 120, 20, 0.92); }
      /* modo tela preta (corte de cena) */
      body.fade { background: #000; animation: fadeOut var(--fade-ms, 1100ms) ease-in forwards; }
      @keyframes fadeOut { 0% { opacity: 1; } 35% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="./src/hud.js"></script>
  </body>
</html>
